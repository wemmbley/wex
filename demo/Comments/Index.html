<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cbcdn.githack.com/wemmbley/quas/raw/branch/master/Compiled/Quas.min.js"></script>
</head>
<body>
    <template id="app">
        <!-- КОММЕНТАРИИ -->
        <section class="mx-auto max-w-4xl px-4 py-12 sm:px-6">
            <!-- Шапка секции: заголовок, счетчик и разделитель -->
            <div class="mb-6 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <h2 class="text-xl font-semibold tracking-tight text-zinc-950">
                        Комментарии
                    </h2>
                    <span class="inline-flex items-center rounded-md border border-zinc-300 bg-zinc-100 px-2 py-0.5 text-xs font-medium text-zinc-700">
                        {{ comments.length }}
                    </span>
                </div>
            </div>
            <!-- Форма нового комментария -->
            <div class="mb-4 rounded-xl border border-zinc-200 bg-white shadow-xs">
                <textarea rows="3" placeholder="Написать комментарий..." class="p-4 w-full resize-none border-0 bg-transparent text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none"></textarea>
                <div class="bg-zinc-100 mt-3 flex items-center justify-between border-t border-zinc-100">
                    <span class="text-xs text-zinc-400">
                        <!-- Дополнительные инструменты если надо -->
                    </span>
                    <button type="button" class="my-2 mx-2 inline-flex h-8 items-center justify-center rounded-md bg-zinc-950 px-3.5 text-xs font-medium text-white cursor-pointer transition-colors hover:bg-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-950">
                        Отправить
                    </button>
                </div>
            </div>
            <!-- Контейнер списка комментариев -->
            <div class="">
                <Comment :comments="comments"></Comment>
                <!-- Пустое состояние (Empty State), если комментариев еще нет -->
                <div w-if="!comments || !comments.length" class="py-10 text-center">
                    <p class="text-sm font-medium text-zinc-900">Пока нет комментариев</p>
                    <p class="mt-1 text-xs text-zinc-500">Станьте первым, кто начнет обсуждение.</p>
                </div>
            </div>
        </section>
    </template>
</body>
<footer>
    <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
    <script src="../../dist/wex.min.js"></script>
    <script>
        $('#app')
            .state({
                comments: []
            })
            .on('$mount', (state) => {
                $wire.get('/Demo/Comments/Structures/Comments.json').to(state.comments)
            })
            .component('Comment', '/Demo/Comments/Components/Comment.html')
            .mount();
    </script>
</footer>
</html>
