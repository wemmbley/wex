<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cbcdn.githack.com/wemmbley/quas/raw/branch/master/Compiled/Quas.min.js"></script>
</head>
<body>
    <template id="app">

        <!-- КОММЕНТАРИИ -->
        <section class="p-15">
            <h2 class="text-[30px] mb-10">Комментарии:</h2>
            <Comment :comments="comments"></Comment>
        </section>

    </template>
</body>
<footer>
    <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
    <script src="https://cbcdn.githack.com/wemmbley/wex/raw/branch/master/dist/wex.min.js"></script>
    <script>
        $('#app')
            .state({
                comments: []
            })
            .on('$mount', (state) => {
                $wire.get('/Test/Structures/Comments.json').to(state.comments);
            })
            .component('Comment', '/Demo/Comments/Components/Comment.html')
            .mount();
    </script>
</footer>
</html>
