<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Wex: lazy demo</title>
    <style>
        body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; color: #222 }
        h2 { margin: 28px 0 8px; font-size: 18px }
        button { padding: 6px 12px; margin-right: 6px; cursor: pointer }
        .box { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin: 8px 0; background: #fafafa }
        .heavy { background: #ecfdf5; border-color: #6ee7b7 }
        .card { display: inline-block; margin: 2px; padding: 2px 8px; background: #e0e7ff; border-radius: 4px; font-size: 12px }
        #log { background: #111; color: #9ef; font: 12px/1.5 ui-monospace, monospace; padding: 10px; border-radius: 6px; min-height: 120px; max-height: 260px; overflow: auto; white-space: pre-wrap }
        .hint { color: #666; font-size: 13px }
    </style>
</head>
<body>
<h1>Wex: проверка lazy</h1>

<template id="app">
    <h2>1. Ленивый компонент</h2>
    <p class="hint">Файл <code>lazy-heavy.html</code> не должен запрашиваться, пока не нажмёте кнопку. Второе нажатие скрывает, третье показывает снова без нового запроса (кэш компонента).</p>
    <button id="btn-heavy">Показать / скрыть Heavy</button>
    <Heavy w-if="showHeavy"></Heavy>

    <h2>2. Префетч данных (wire.prefetch)</h2>
    <p class="hint">Наведите мышь на кнопку: в логе появится запрос <code>lazy-items.json</code>. Клик заберёт готовый ответ без нового запроса.</p>
    <button id="btn-load">Загрузить список [Императивно]</button>
    <button w-prefetch="./LazyItems.json" w-to="items">Загрузить список [Декларативно]</button>
    <div w-for="it in items">
        <div class="box">#{{ it.id }} {{ it.name }}</div>
    </div>

    <h2>3. Очередь монтирования</h2>
    <p class="hint">300 компонентов: первые <code>syncMounts</code> монтируются сразу, остальные по кадрам. Страница не должна подвисать, счётчик в логе растёт до 300.</p>
    <button id="btn-cards">Показать 300 карточек</button>
    <button id="btn-clear">Скрыть карточки</button>
    <div>
        <span w-for="c in cards"><Card :title="c.title"></Card></span>
    </div>
</template>

<h2>Лог запросов и событий</h2>
<div id="log"></div>
</body>
<footer>
    <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
    <script src="../../dist/wex.js"></script>
    <script src="./Helpers.js"></script>
    <script>
        $('#app')
            .state({ showHeavy: false, items: [], cards: [] })
            .on('click', '#btn-heavy', (state) => {

                // Тогглим демонстрацию блока.
                state.showHeavy = !state.showHeavy
                log('showHeavy = ' + state.showHeavy)

            })
            .on('mouseenter', '#btn-load', () => {
                log('hover: prefetch lazy-items.json')

                // Делаем префетч при наведении
                $wire.prefetch('./LazyItems.json')
            })
            .on('click', '#btn-load', (state) => {
                log('click: wire.get (должен забрать префетч)')

                // А вот при клике уже загружаем в стейт
                $wire.get('./LazyItems.json').to(state.items)
                    .done(() => log('данные получены: ' + state.items.length + ' шт.'))
            })
            .on('click', '#btn-cards', (state) => {
                window.__mounted = 0
                const cards = []
                for (let i = 1; i <= 300; i++) cards.push({ title: 'Карточка ' + i })
                log('создаю 300 карточек (syncMounts = 50)')
                watchMounted(300, performance.now())

                // Добавляем в стейт карточки, w-for подхватит сам.
                state.cards = cards
            })
            .on('click', '#btn-clear', (state) => {

                // Удаляем из стейта карточки, w-for подхватит обновление.
                state.cards = []

                log('карточки скрыты')
            })
            .component('Heavy', './LazyHeavy.html', { lazy: true })
            .component('Card', './LazyCard.html', { lazy: true })
            .mount()
    </script>
</footer>
</html>
