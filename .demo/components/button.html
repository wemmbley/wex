<template>
    <slot></slot>
    <br>
    <button class="btn">
        {{ label }}: {{ count }}
    </button>
</template>

<script type="module">
    export default ($component) => $component
        .state({
            label: 'Кликов',
            count: 0
        })
        .method('buy', state => () => {
            state.count++
        })
        .on('click', '.btn', function (state) {
            return this.method('buy')(state)
        })
</script>
